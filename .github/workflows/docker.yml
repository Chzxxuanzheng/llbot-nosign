name: Docker

# 本仓库的 CI 只做一件事：把源码打成多架构 Docker 镜像并推送到 ghcr.io。
# 不跑 test / lint / tsc，不产出任何平台原生制品。
# 镜像从本仓库源码构建（docker/Dockerfile.local），不下载任何上游 Release 资产。
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ghcr.io 强制镜像名全小写，而 ${{ github.repository }} 可能含大写，
      # metadata-action 不会自动转换，因此用 shell 展开显式转小写。
      - name: Compute lowercase image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签规则：
      #   tag 推送         -> 与 tag 同名（如 v7.13.0-nosign）
      #   默认分支 push    -> latest
      #   任意触发         -> 短 sha，便于回溯到具体提交
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=LuckyLilliaBot
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 必须使用 Dockerfile.local：docker/Dockerfile 依赖上游 GitHub Release 的
      # LLBot.zip，本分支版本在上游并不存在。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.local
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
